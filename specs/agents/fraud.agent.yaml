name: fraud_agent
description: Rule-based fraud detection and risk scoring
budgets:
  max_tool_calls: 3
  max_wallclock_seconds: 10
  max_cost_usd: 0.05
scopes:
  - read
  - fraud_read
rules:
  - type: threshold
    field: loan_amount
    max: 500000
    risk_weight: 0.3
  - type: velocity_check
    field: applications_last_30_days
    max: 3
    risk_weight: 0.4
  - type: blacklist
    field: ssn
    source: fraud_db
    risk_weight: 1.0
thresholds:
  low_risk: 0.3
  high_risk: 0.7
