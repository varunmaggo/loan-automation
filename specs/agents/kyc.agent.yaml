name: kyc_agent
description: Verifies applicant identity and address
version: "1.0"

requirements:
  - verify applicant identity
  - verify applicant address
  - detect KYC issues

capabilities:
  - perform identity verification
  - perform address verification
  - generate KYC report

budgets:
  max_tool_calls: 2
  max_wallclock_seconds: 10
  max_cost_usd: 0.05

scopes:
  - read
  - kyc_read

required_scopes:
  - read
  - kyc_read
