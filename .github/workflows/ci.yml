name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run ruff
        run: ruff check src/ evals/ tests/
      
      - name: Run mypy
        run: mypy src/ evals/ tests/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"
      
      - name: Run tests
        run: pytest -q --cov=loan_triage --cov-report=term-missing --cov-fail-under=80

  evals:
    name: DeepEval Suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals]"
      
      - name: Run DeepEval
        run: |
          DEEPEVAL_TELEMETRY_OPT_OUT=YES python -m evals.run_evals
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

  merge:
    name: Merge Ready
    runs-on: ubuntu-latest
    needs: [quality, test, evals]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check all jobs passed
        run: echo "All jobs passed - ready to merge"
